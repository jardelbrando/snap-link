# ==========================================
# 1. SERVER AND IDENTIFICATION
# ==========================================
server:
  port: 8080

spring:
  application:
    name: snaplink-api

  # ==========================================
  # 2. DATABASE AND PERSISTENCE
  # ==========================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snaplink_db}
    username: ${DB_USER:snaplink_user}
    password: ${DB_PASSWORD:snaplink_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 3. OBSERVABILITY AND LOGS
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springdoc: DEBUG

# ==========================================
# 4. CUSTOM API SETTINGS
# ==========================================
api:
  security:
    token:
      secret: ${JWT_SECRET:c8f94e2a71b30d658c9e4a12b7f03d865e91a2c4f8d60b371a5c9e2d8b4f0a63}